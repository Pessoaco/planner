  const fields = {
    Tarefa: t.Tarefa,
    'Divisão': t['Divisão'] || '',
    Prioridade: t.Prioridade || 'Média',
    Status: t.Status || 'Aberto',
    Envolvido: t.Envolvido || '',
    'Data Prevista': t['Data Prevista'] || '',
    Hora: t.Hora || '',
    'Data Fim': t['Data Fim'] || '',
    'Hora Fim': t['Hora Fim'] || '',
    'Observação': t['Observação'] || ''
  };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'addTask', aba: t._aba, fields })
    });
    const data = await res.json();
    if (!data.ok) { showToast('⚠️ Erro: ' + (data.error || 'tente novamente')); return; }
    await loadData();
    const nova = (allData[t._aba] || []).find(x => String(x.ID) === String(data.id));
    if (nova) openEditModal({ ...nova, _aba: t._aba });
    showToast('✅ Tarefa duplicada — troca o nome e salva!');

    showToast('⚠️ Sem conexão');

}

function parseDataParaInput(dataRaw) {
  if (!dataRaw) return '';
  const partes = String(dataRaw).split('/');
  if (partes.length === 3) return `${partes[2]}-${partes[1]}-${partes[0]}`;
  const d = new Date(dataRaw);
  return !isNaN(d) ? d.toISOString().split('T')[0] : '';
}

async function salvarTarefa() {
  const aba = document.getElementById('f-aba').value;
  if (!aba) { showToast('⚠️ Escolha a pasta'); return; }

  const tarefa = document.getElementById('f-tarefa').value.trim();
  if (!tarefa) { showToast('⚠️ Digite o nome da tarefa'); return; }

  const catSel = document.getElementById('f-categoria').value;
  const categoria = catSel === '__nova__'
    ? document.getElementById('f-nova-cat').value.trim()
    : catSel;
  if (!categoria) { showToast('⚠️ Informe a divisão'); return; }

  const prioridade = document.querySelector('.prio-btn.sel')?.dataset.p || 'Média';
  // Converte de yyyy-mm-dd (input type=date) pro formato brasileiro dd/mm/aaaa antes de salvar na planilha
  const dataPrevistaRaw = document.getElementById('f-data').value;
  const dataPrevista = dataPrevistaRaw ? formatarDataBR(dataPrevistaRaw) : '';
  const hora = document.getElementById('f-hora').value;
  const dataFimRaw = document.getElementById('f-data-fim').value;
  const dataFim = dataFimRaw ? formatarDataBR(dataFimRaw) : '';
  const horaFim = document.getElementById('f-hora-fim').value;
  const obs = document.getElementById('f-obs').value.trim();
  const envolvido = document.getElementById('f-envolvido').value.trim();
  const editando = !!editandoId;

  const btn = document.getElementById('btn-salvar');
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const fields = {
    Tarefa: tarefa,
    'Divisão': categoria,
    Prioridade: prioridade,
    'Data Prevista': dataPrevista || '',
    Hora: hora || '',
    'Data Fim': dataFim || '',
    'Hora Fim': horaFim || '',
    Envolvido: envolvido,
    'Observação': obs
  };
  if (!editando) {
    fields.Status = 'Aberto';
  } else {
    const novoStatus = document.getElementById('f-status').value;
    fields.Status = novoStatus;
    if (novoStatus !== 'Concluído') {
      fields['Data conclusão'] = '';
    } else {
      const dataConclusaoRaw = document.getElementById('f-data-conclusao').value;
      fields['Data conclusão'] = dataConclusaoRaw
        ? formatarDataBR(dataConclusaoRaw)
        : new Date().toLocaleDateString('pt-BR');
    }
  }

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(editando
        ? { action: 'editTask', aba: editandoAba, id: editandoId, fields }
        : { action: 'addTask', aba, fields }
      )
    });
    const data = await res.json();
    if (data.ok) {
      closeAddModal();
      showToast(editando ? '✅ Tarefa atualizada!' : '✅ Tarefa criada!');

      // Atualiza só a tarefa em memória em vez de recarregar tudo — evita a tela branca
      if (editando) {
        const tarefaAtual = (allData[editandoAba] || []).find(t => String(t.ID) === String(editandoId));
        if (tarefaAtual) Object.assign(tarefaAtual, fields);
      } else {
        if (!allData[aba]) allData[aba] = [];
        allData[aba].push(Object.assign({ ID: data.id, 'Data criação': new Date().toLocaleDateString('pt-BR') }, fields));
      }
      renderMantendoScroll();
    } else {
      showToast('⚠️ Erro: ' + (data.error || 'tente novamente'));
    }
  } catch (e) {
    showToast('⚠️ Sem conexão');
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

// ===== PRINT =====
// "reduzido" = uma linha compacta por tarefa. "tela" = mantém cards/lista igual você vê no app.
function imprimir(modo) {
  const vistaOriginal = vistaModo;
  // O formato reduzido foi feito pro HTML do card — se a tela tava em lista, força card só pra impressão
  if (modo === 'reduzido' && vistaOriginal === 'lista') { vistaModo = 'cards'; aplicarVista(); render(); }

  document.body.classList.remove('print-reduzido', 'print-tela', 'vista-lista-print');
  document.body.classList.add(modo === 'tela' ? 'print-tela' : 'print-reduzido');
  if (modo === 'tela' && vistaOriginal === 'lista') document.body.classList.add('vista-lista-print');

  window.print();

  setTimeout(() => {
    document.body.classList.remove('print-reduzido', 'print-tela', 'vista-lista-print');
    if (vistaModo !== vistaOriginal) { vistaModo = vistaOriginal; aplicarVista(); render(); }
  }, 500);
}

function showToast(msg) {

// Inicia
// Usa a última lista de pastas conhecida (salva no aparelho) antes mesmo da resposta do servidor chegar,
// pra não mostrar por 1-2s a lista antiga/errada enquanto carrega de verdade
try {
  const pastasCache = JSON.parse(localStorage.getItem('pastasCache') || 'null');
  if (Array.isArray(pastasCache) && pastasCache.length) sincronizarPastas(pastasCache);
} catch (e) {}
renderTabs();
aplicarVista();
loadData();
</script>
